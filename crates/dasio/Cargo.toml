[package]
name = "dasio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "dasio's device process: one Dante device per instance, its audio through the shared memory to the ASIO driver"

[dependencies]
dstack-audio-io = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.53" }
dstack = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.53" }
shm = { path = "../shm" }
asio-driver = { path = "../asio-driver" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
windows-service = "0.8.1"
