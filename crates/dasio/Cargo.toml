[package]
name = "dasio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "dasio's device process: one Dante device per instance, its audio through the shared memory to the ASIO driver"

[dependencies]
dstack-audio-io = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.110" }
dstack = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.110" }
shm = { path = "../shm" }
asio-driver = { path = "../asio-driver" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ErrorReporting",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
windows-service = "0.8.1"
# The device's control-port slot (`slots::pick`, the rule dsend and dlisten
# use, dasio#89). Windows only: it brings cpal, which on Linux needs ALSA's
# headers, and only the device start (run.rs, Windows) calls it.
dstack-endpoint = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.110" }

[dev-dependencies]
# The bridge's real-time proof (tests/rt_bridge.rs, dasio#28 E13): counts
# allocations inside `assert_no_alloc` instead of aborting.
assert_no_alloc = { version = "1.1.2", default-features = false, features = ["warn_debug", "warn_release"] }

[lints.rust]
# The rtsan CI job's cfg (dasio#28 E13).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dasio_rtsan)"] }
