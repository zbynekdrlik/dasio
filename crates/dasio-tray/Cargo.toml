[package]
name = "dasio-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "dasio's tray icon: each instance's service, DAW, latencies and late blocks, read-only"

[dependencies]
shm = { path = "../shm" }

[target.'cfg(windows)'.dependencies]
asio-driver = { path = "../asio-driver" }
tray-icon = "0.21"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "dasio-tray"
path = "src/main.rs"
