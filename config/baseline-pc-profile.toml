# What must not exist on a dasio PC (owner 16.11.2026, dasio#128): the
# check reports it, `dasio pc-profile apply` removes it.

[[absent]]
exe = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
uninstall = ['C:\Program Files (x86)\Microsoft\Edge\Application\*\Installer\setup.exe', '--uninstall', '--msedge', '--system-level', '--verbose-logging', '--log-file=C:\ProgramData\dasio\msedge_installer.log', '--force-uninstall']
# Its setup refuses on Windows 10 LTSC without EdgeUpdateDev AllowUninstall
# ("Edge not uninstallable per regional policy", FOH 17.11.2026): apply
# writes it first (only a value on pc_profile::absent::PRE_UNINSTALL_WRITES).
# --verbose-logging + --log-file: setup logs its own reason to
# C:\ProgramData\dasio\msedge_installer.log when it still refuses (dasio#128).
before_uninstall = ['HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdateDev\AllowUninstall']
# Even so it refused ("Not a Windows caller", exit 532): setup allows the
# uninstall only when its parent is dllhost.exe in Windows' own folder, so
# apply runs it through a copy of System32's cmd.exe as
# %SystemRoot%\SystemTemp\dllhost.exe, deleted after (FOH 17.11.2026: Edge
# removed, its log "Uninstall allowed: Windows caller"; dasio#128).
windows_caller = true
why = "Microsoft Edge: owner 16.11.2026: no browser and no updater on a dasio PC, removed, not only disabled, so nothing starts by chance; re-removed after a Windows upgrade (dasio#128)"

[[absent]]
exe = 'C:\Program Files (x86)\Microsoft\EdgeUpdate\MicrosoftEdgeUpdate.exe'
uninstall = ['C:\Program Files (x86)\Microsoft\EdgeUpdate\MicrosoftEdgeUpdate.exe', '/uninstall']
# Its /uninstall exits 0 but keeps itself while WebView2 is installed (dsg +
# mbc 16.11.2026): then apply stops it and deletes its folder (dasio#128).
remove_dir = 'C:\Program Files (x86)\Microsoft\EdgeUpdate'
stop_processes = ['MicrosoftEdgeUpdate.exe', 'MicrosoftEdgeUpdateCore.exe', 'MicrosoftEdgeUpdateOnDemand.exe', 'MicrosoftEdgeUpdateBroker.exe']
why = "Edge's updater (it re-installs Edge and runs as a service): owner 16.11.2026: no browser and no updater on a dasio PC, removed, not only disabled, so nothing starts by chance; re-removed after a Windows upgrade (dasio#128)"

[[absent]]
service = "edgeupdate"
why = "Edge's updater service: owner 16.11.2026: no browser and no updater on a dasio PC, removed, not only disabled, so nothing starts by chance; re-removed after a Windows upgrade (dasio#128)"

[[absent]]
service = "edgeupdatem"
why = "Edge's updater service: owner 16.11.2026: no browser and no updater on a dasio PC, removed, not only disabled, so nothing starts by chance; re-removed after a Windows upgrade (dasio#128)"

[[absent]]
service = "MicrosoftEdgeElevationService"
why = "Edge's updater service: owner 16.11.2026: no browser and no updater on a dasio PC, removed, not only disabled, so nothing starts by chance; re-removed after a Windows upgrade (dasio#128)"

[[absent]]
task = '\MicrosoftEdgeUpdateTaskMachineCore*'
why = "Edge's updater task (its name ends in a GUID): owner 16.11.2026: no browser and no updater on a dasio PC, removed, not only disabled, so nothing starts by chance; re-removed after a Windows upgrade (dasio#128)"

[[absent]]
task = '\MicrosoftEdgeUpdateTaskMachineUA*'
