# The Dante NIC's driver package per NIC family (dasio#128), by the NIC's
# hardware, whichever driver is bound now (an inbox rtcx21 on a RTL8168
# reads as the wrong version and provider). Checked only (WARN + tray
# count): `install.ps1 -NicDriver <folder>` installs it, after `dasio
# pc-profile nic-driver` found the folder to be exactly these files (SHA256)
# with the catalog signed by `signer`. Realtek no longer serves 10.79 (its
# download page lists only the newest release, the Microsoft Update Catalog
# has none, 17.11.2026), so the folder is a copy of FOH's package.
[[nic_driver]]
family = "Realtek PCIe (rt640x64)"
hardware_ids = ['PCI\VEN_10EC&DEV_8125', 'PCI\VEN_10EC&DEV_8168']
version = "10.79.20.1003"
provider = "Realtek"
inf = "rt640x64sta.inf"
signer = "Microsoft Windows Hardware Compatibility Publisher"
source = "FOH's driver store: pnputil /export-driver <its rt640x64sta.inf oem name> <folder> (10.79 is no longer on realtek.com)"
why = "Realtek 10.79.20.1003 measured best with rxd + kernel TX on FOH (RTL8125); the inbox rtcx21 and 10.39 drivers were worse (dasio#1), dsg's inbox rtcx21 ~550 us later arrival than iem-mixer (RTL8168, dasio#128); the INF covers both"

