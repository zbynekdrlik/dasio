# dasio's baseline PC setup (dasio#128): every Windows setting proven on the
# FOH PC, mbc and dsg, applied and checked on every dasio PC. Built into
# dasio.exe; each PC's own profile (C:\ProgramData\dasio\pc-profile.toml)
# adds or overrides site data (adapter GUID, CPU layout, its own services).
# No site data here: no addresses, no device names, no GUIDs of one PC.
# Check: dasio pc-profile check; set: dasio pc-profile apply [--plan].
# `must = true`: dasio does not run without it (the service ends, the check
# exits 2, install.ps1 refuses). `computed`: the value comes from the PC's
# CPU layout (system CPUs = 1 per 8, then dasio's, then the DAW's).
# `[[absent]]`: a program, service or task that must not exist; `apply`
# removes it (dasio#128).
name = "dasio baseline"

[[registry]]
key = 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
name = "SystemResponsiveness"
dword = 10
why = "FOH measured 10; 0 was not honoured (20 % demotion), dasio#1"

[[registry]]
key = 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile'
name = "NetworkThrottlingIndex"
dword = 4294967295
why = "no network throttling under multimedia load, dasio#1"

[[registry]]
key = 'HKLM\SYSTEM\CurrentControlSet\Services\MMCSS'
name = "Start"
dword = 4
why = "owner 4.11.2026: MMCSS off; with it on the DAWs and the driver thread ran demoted to pri 3 for 8-19 %, dasio#1"

[[registry]]
key = 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager'
name = "DisableWpbtExecution"
dword = 1
why = "no firmware-installed vendor services (FOH Gigabyte, dsg Acer), dasio#1"

[[registry]]
key = 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\Maintenance'
name = "MaintenanceDisabled"
dword = 1
why = "no automatic maintenance on a dasio PC, dasio#120"

[[registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
name = "AllowTelemetry"
dword = 0
why = "no telemetry work, dasio#120"

[[registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
name = "NoAutoUpdate"
dword = 1
why = "owner: Windows updates are dasio's job, never automatic (dasio#109, #120)"

[[registry]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
