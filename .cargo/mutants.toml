# cargo-mutants, the CI's diff-scoped gate (`mutation` job): the portable
# decision code only. Windows-only code is compiled out on the Linux runner,
# so its mutants would pass unseen: excluded here, and kept thin glue over
# the portable modules (guard, liveness, reset, service, shm's layout).
profile = "mutants"
test_tool = "nextest"
exclude_globs = [
  "crates/asio-driver/src/com.rs",
  "crates/asio-driver/src/driver.rs",
  "crates/asio-driver/src/driver/worker.rs",
  "crates/shm/src/windows.rs",
  "crates/dasio/src/cpu_snap/windows.rs",
  "crates/dasio/src/jitter.rs",
  "crates/dasio/src/kernel_tx/windows.rs",
  "crates/dasio/src/pc_profile/windows.rs",
  "crates/dasio/src/main.rs",
  "crates/dasio/src/probe.rs",
  "crates/dasio/src/run.rs",
  "crates/dasio/src/run/profile.rs",
  "crates/dasio/src/run_bridge.rs",
  "crates/dasio/src/service/windows.rs",
]
# The `win` modules of register.rs and bridge.rs: Windows-only too.
# RotatingLog's flush: std's File writes unbuffered, so its flush is a
# no-op and `Ok(())` in its place is the same program.
# `seq | ACKED_MARK` in Header::ack_block and shm's paired(): a seq never
# reaches bit 62, so `^` gives the same value (an equivalent mutant no test
# can tell apart). cpu_snap's filetime joins a high half shifted by 32
# with a low half: they never overlap, so `^` is `|` there too. These
# functions use `|` for nothing else; a new `|` there needs this line
# narrowed.
# systime.rs's calibrate reads timeGetTime: Windows-only, tested on the
# Windows runner (systime's own test), compiled out here. Mutant names
# carry the file path and the bare function name, so the pattern does too.
exclude_re = [
  "\\bwin::",
  "src/systime\\.rs:.*\\bcalibrate\\b",
  "RotatingLog>::flush",
  "replace \\| with \\^ in (Header::ack_block|paired|filetime)",
]
